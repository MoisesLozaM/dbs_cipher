<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAC 1.0</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <main class="container-main">
    <h1>S.A.C 1.0</h1>

    <form class="row" id="data-vc-form">
      <div id="password-div">
        <input id="data-vc-input-key" placeholder="Ingrese la llave..." />
        <button type="button" id="data-vc-btn-unlock">Desbloquear</button>
      </div>
      <div id="data-vc-div">
        <input id="data-vc-input-plate" placeholder="Ingrese la placa..." />
        <input id="data-vc-input-series" placeholder="Ingrese la serie..." />
        <input id="data-vc-input-motor" placeholder="Ingrese el motor..." />
        <button type="submit">Consultar</button>
        <button type="button" id="data-vc-btn-clear">Limpiar</button>
      </div>

    </form>
    <div id="data-vc-msg"></div>
  </main>
</body>

</html>
